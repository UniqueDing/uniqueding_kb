name: USB log diagnostics build

on:
  workflow_dispatch:
  push:
    branches:
      - charybdis-heetuic-keymap
    paths:
      - "diagnostics/**"
      - "build-diagnostics.yaml"
      - ".github/workflows/diagnostics.yml"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
    with:
      build_matrix_path: build-diagnostics.yaml
      archive_name: firmware-diagnostics
