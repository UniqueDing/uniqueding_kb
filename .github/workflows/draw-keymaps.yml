name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/charybdis.keymap"
      - "config/kanata-macros.dtsi"
      - "config/boards/shields/charybdis/charybdis.dtsi"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymaps.yml"
      - ".github/keymap-drawer-requirements.txt"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned keymap-drawer dependencies
        run: python -m pip install -r .github/keymap-drawer-requirements.txt

      - name: Create output directory
        run: mkdir -p img

      - name: Parse keymap
        run: >-
          keymap -c keymap_drawer.config.yaml parse -z config/charybdis.keymap
          -o img/charybdis.yaml

      - name: Draw SVG
        run: >-
          keymap -c keymap_drawer.config.yaml draw img/charybdis.yaml
          --dts-layout config/boards/shields/charybdis/charybdis.dtsi
          --layout-name charybdis_layout
          -o img/charybdis.svg

      - name: Commit generated diagrams
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "img/*.svg img/*.yaml"
          commit_message: "keymap-drawer render"
